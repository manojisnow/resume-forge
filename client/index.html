<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResumeForge</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; }
      .rf-utility button, .rf-utility select {
        font: inherit; color: #334155; background: #f8fafc;
        border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px 8px;
        cursor: pointer; line-height: 1.4;
      }
      .rf-utility button:hover:not(:disabled) { background: #e2e8f0; }
      .rf-utility button:disabled { opacity: .45; cursor: not-allowed; }
      .rf-utility button:focus-visible, .rf-utility select:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
      dialog::backdrop { background: rgba(15, 23, 42, .45); }
      @media print {
        body * { visibility: hidden; }
        #resume-preview, #resume-preview * { visibility: visible; }
        #resume-preview { position: fixed; top: 0; left: 0; width: 210mm; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
