name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm run install:all
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm audit --prefix client --audit-level=high
      - run: npm audit --prefix server --audit-level=high
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: docker compose -f compose.yml -f compose.build.yml up --build -d --wait
      - run: docker compose -f compose.yml -f compose.build.yml exec -T app node < scripts/container-check.cjs
      - if: always()
        run: docker compose -f compose.yml -f compose.build.yml logs --tail=100
      - if: always()
        run: docker compose -f compose.yml -f compose.build.yml down
