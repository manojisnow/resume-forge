name: resume-forge
services:
  app:
    image: ${RESUMEFORGE_IMAGE:-ghcr.io/manojisnow/resume-forge:latest}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-http://host.docker.internal:8081/v1}
      LLAMACPP_MODEL: ${LLAMACPP_MODEL:-local-model}
      LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-}
      ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080}
      PDF_DISABLE_SANDBOX: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256mb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
